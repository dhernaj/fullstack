# Configuración exclusiva de pruebas: no depende del .env.local ni de PostgreSQL.
spring.application.name=academia-api-test
spring.profiles.default=test
spring.datasource.url=jdbc:h2:mem:pruebas;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
app.jwt.secret=Y2xhdmUtcHVibGljYS1leGNsdXNpdmEtcGFyYS1wcnVlYmFzLW5vLXVzYXItZW4tcHJvZHVjY2lvbi0yMDI2
app.jwt.expiracion-minutos=5
app.cors.origenes=http://localhost:4200
spring.data.web.pageable.max-page-size=50
app.demo.enabled=false
