spring.application.name=academia-api
server.port=8080 

# Respuestas de error estandarizadas (RFC 9457 - Problem Details) 
spring.mvc.problemdetails.enabled=true 

# Buenas prácticas OWASP: no exponer detalles internos en los errores 
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.address=127.0.0.1
spring.profiles.default=postgres

# Persistencia y límites del Laboratorio 2
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.data.web.pageable.max-page-size=50

# Emisión y validación JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=60
app.cors.origenes=http://localhost:4200

# Cuentas de demostración: habilitar solo en el entorno local del laboratorio.
app.demo.enabled=${APP_DEMO_ENABLED:false}
