name: academia-upn
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: academia
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d academia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./academia-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/academia
      DB_USER: academia
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      CORS_ORIGINS: http://localhost:4200
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
  pgdata:
