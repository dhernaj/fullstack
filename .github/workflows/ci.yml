name: CI Academia UPN

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend y cobertura
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: academia-api/pom.xml
      - name: Ejecutar pruebas y comprobar cobertura
        working-directory: academia-api
        run: ./mvnw -B verify
      - name: Guardar cobertura y resultados
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-jacoco
          path: |
            academia-api/target/site/jacoco/
            academia-api/target/surefire-reports/
          retention-days: 14

  frontend:
    name: Angular y Vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: academia-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: academia-web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  e2e:
    name: Docker, Flyway y Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: academia-ci-${{ github.run_id }}-${{ github.run_attempt }}
      API_PORT: '8080'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generar claves efímeras de esta prueba
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          claves = {
              'JWT_SECRET': base64.b64encode(secrets.token_bytes(32)).decode(),
              'ADMIN_PASSWORD': secrets.token_urlsafe(24),
              'DB_PASSWORD': secrets.token_urlsafe(24),
          }
          with open(os.environ['GITHUB_ENV'], 'a') as archivo:
              for nombre, valor in claves.items():
                  print('::add-mask::' + valor)
                  archivo.write(nombre + '=' + valor + '\n')
          PY
      - name: Validar Compose y construir el entorno
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 180
      - name: Comprobar producción y persistencia
        run: python3 scripts/verificar-compose.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: academia-web/package-lock.json
      - name: Preparar Playwright en Linux
        working-directory: academia-web
        run: |
          npm ci
          npx tsc --project tsconfig.e2e.json
          npx playwright install --with-deps chromium
      - name: Ejecutar las tres pruebas de navegador
        working-directory: academia-web
        run: npm run e2e
      - name: Guardar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            academia-web/playwright-report/
            academia-web/test-results/
          retention-days: 14
      - name: Guardar estado y logs
        if: always()
        run: |
          mkdir -p evidencias/parte-e
          docker compose ps -a > evidencias/parte-e/compose-estado.txt
          docker compose logs --no-color > evidencias/parte-e/compose-logs.txt
      - name: Publicar evidencias de Docker
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-produccion
          path: |
            evidencias/parte-e/docker-produccion.json
            evidencias/parte-e/compose-estado.txt
            evidencias/parte-e/compose-logs.txt
          retention-days: 14
      - name: Retirar el entorno efímero
        if: always()
        run: docker compose down --volumes --remove-orphans
