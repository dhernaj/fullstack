<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="h4 mb-1 nh-title">Iniciar sesión</h2>
        <p class="text-muted small mb-4">Academia UPN · Gestión de cursos</p>
        @if (error()) {
          <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
        }
        <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate [attr.aria-busy]="enviando()">
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input id="username" class="form-control" formControlName="username" autocomplete="username"
              maxlength="50" required aria-describedby="username-error"
              [attr.aria-invalid]="form.controls.username.touched && form.controls.username.invalid"
              [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid" />
            <div id="username-error" class="invalid-feedback">Ingresa un usuario de hasta 50 caracteres.</div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" type="password" class="form-control" formControlName="password"
              autocomplete="current-password" maxlength="100" required aria-describedby="password-error"
              [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
              [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid" />
            <div id="password-error" class="invalid-feedback">Ingresa una contraseña de hasta 100 caracteres.</div>
          </div>
          <button type="submit" class="btn btn-nh w-100" [disabled]="enviando()">
            {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
